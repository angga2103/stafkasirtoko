name: KasirToko Staff Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_notes_extra:
        description: "Catatan perubahan tambahan untuk release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Validate, Sign & Publish KasirToko Staff Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install SQLite3 for FFI Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Pub Get
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Full Staff Test Suite
        run: flutter test --no-pub -r expanded -j 1

      - name: Validate Permanent Signing Secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Permanent release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are required! Refusing unsigned or debug-signed release."
            exit 1
          fi

      - name: Build Signed Release APK & AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release-staff.jks"
          cleanup() {
            rm -f "$KEYSTORE_FILE" android/key.properties
          }
          trap cleanup EXIT

          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_FILE
          EOF

          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation
          flutter build appbundle --release --target-platform android-arm,android-arm64 --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: Verify APK Signature, Manifest & Checksums
        id: verify_apk
        run: |
          set -euo pipefail
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VER_NAME="${PUBSPEC_VER%%+*}"
          VER_CODE="${PUBSPEC_VER##*+}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
          else
            TAG_VER="$VER_NAME"
          fi

          mkdir -p build/release-out
          APK_ARM64="build/release-out/KasirToko-Staff-v${VER_NAME}-arm64-v8a-release.apk"
          APK_ARMV7="build/release-out/KasirToko-Staff-v${VER_NAME}-armeabi-v7a-release.apk"
          APK_UNIV="build/release-out/KasirToko-Staff-v${VER_NAME}-arm-universal-release.apk"
          AAB_OUT="build/release-out/KasirToko-Staff-v${VER_NAME}-release.aab"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_ARM64"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$APK_ARMV7"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_UNIV"
          cp build/app/outputs/bundle/release/app-release.aab "$AAB_OUT"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)

          CERT_SHA256=""
          for APK_FILE in "$APK_ARM64" "$APK_ARMV7" "$APK_UNIV"; do
            VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_FILE")
            echo "$VERIFY_OUT"
            if echo "$VERIFY_OUT" | grep -qi "Android Debug"; then
              echo "::error::APK $APK_FILE is signed with Android Debug certificate! Official release rejected."
              exit 1
            fi
            CERT_SHA256=$(echo "$VERIFY_OUT" | grep -i "Signer #1 certificate SHA-256 digest" | head -n 1 | awk -F': ' '{print $2}')
            BADGING=$("$AAPT2" dump badging "$APK_FILE")
            echo "$BADGING" | head -n 5
            echo "$BADGING" | grep -q "name='com.kasirtoko.app.stafkasirtoko'"
            echo "$BADGING" | grep -q "versionName='$VER_NAME'"
            echo "$BADGING" | grep -q "application-label:'KasirToko Staff'"
          done
          "$AAPT2" dump badging "$APK_UNIV" | grep -q "versionCode='$VER_CODE'"

          (cd build/release-out && for F in *.apk *.aab; do sha256sum "$F" > "$F.sha256"; done)
          SHA_ARM64=$(awk '{print $1}' "${APK_ARM64}.sha256")
          SHA_ARMV7=$(awk '{print $1}' "${APK_ARMV7}.sha256")
          SHA_UNIV=$(awk '{print $1}' "${APK_UNIV}.sha256")
          BYTES_ARM64=$(wc -c < "$APK_ARM64")
          BYTES_ARMV7=$(wc -c < "$APK_ARMV7")
          BYTES_UNIV=$(wc -c < "$APK_UNIV")

          cat > build/release-notes.md <<EOF
          ## KasirToko Staff v${VER_NAME} (versionCode ${VER_CODE})

          Aplikasi **Terminal Kasir POS Staff** (\`com.kasirtoko.app.stafkasirtoko\`) yang terhubung aman ke KasirToko Admin.

          ### Ringkasan Rilis
          - Branding resmi **KasirToko Staff** dengan adaptive icon, monochrome, dan aset in-app.
          - TLS certificate pinning SHA-256 (termasuk transisi rotasi), request signing HMAC-SHA256, Android Keystore storage.
          - Offline checkout hard-lock, keranjang persisten SQLite cache-only tanpa \`cost_price\`, serta rekonsiliasi idempotency otomatis saat reconnect.
          - Optimasi rilis: NDK strip simbol native, \`--split-per-abi\` (arm64-v8a / armeabi-v7a), kompresi JNI libs, tree-shaking ikon, dan R8 minify.
          ${{ inputs.release_notes_extra }}

          ### Integritas & Keamanan Distribusi
          - **\`KasirToko-Staff-v${VER_NAME}-arm64-v8a-release.apk\`** (${BYTES_ARM64} bytes) — SHA-256: \`${SHA_ARM64}\`
          - **\`KasirToko-Staff-v${VER_NAME}-armeabi-v7a-release.apk\`** (${BYTES_ARMV7} bytes) — SHA-256: \`${SHA_ARMV7}\`
          - **\`KasirToko-Staff-v${VER_NAME}-arm-universal-release.apk\`** (${BYTES_UNIV} bytes) — SHA-256: \`${SHA_UNIV}\`
          - **Signing Certificate SHA-256:** \`${CERT_SHA256}\`

          ### Catatan Kompatibilitas & Update
          - Rilis ini menggunakan **permanent RSA-4096 release signing**.
          - Seluruh rilis berikutnya dengan sertifikat permanen yang sama dan \`versionCode > ${VER_CODE}\` dapat di-update langsung tanpa uninstall.
          - Jika sebelumnya terpasang debug APK pengembangan, uninstall sekali versi debug lama lalu pasang rilis permanen ini.
          EOF

          echo "ver_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${TAG_VER}" >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KasirToko-Staff-Release
          path: build/release-out/
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KasirToko Staff v${{ steps.verify_apk.outputs.ver_name }}"
          body_path: build/release-notes.md
          files: build/release-out/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
