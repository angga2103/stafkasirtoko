name: KasirToko Staff Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Staff Release / Fallback APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub -j 1

      - name: Configure Signing & Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/release-out
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/release.jks
          EOF
            flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
            rm -f /tmp/release.jks android/key.properties
            cp build/app/outputs/flutter-apk/app-release.apk build/release-out/KasirToko-Staff-release.apk
          else
            echo "::notice::ANDROID_KEYSTORE_* secrets not configured. Building debug APK without fabricating signing keys."
            flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation
            cp build/app/outputs/flutter-apk/app-debug.apk build/release-out/KasirToko-Staff-debug-fallback.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KasirToko-Staff-Release
          path: build/release-out/
          retention-days: 30
