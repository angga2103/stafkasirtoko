name: stafkasirtoko
description: "Aplikasi Terminal Kasir Staff POS Multi-Device Terhubung ke Server POS Admin KasirToko."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.8
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
  pointycastle: ^4.0.0

dependency_overrides:
  # Use pure Kotlin path_provider_android 2.2.x to avoid transitive C++/CMake jni build failures
  path_provider_android: ">=2.2.5 <2.3.0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kasirtoko_staff_logo.png
